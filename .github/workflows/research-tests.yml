name: Research code checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only test dependencies
        run: python -m pip install 'numpy>=1.26' 'pandas>=2.1'
      - name: Run unit tests without restricted market data
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
